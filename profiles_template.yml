# Instruction
# Copy the contents of this file to C:\Users\<YourUsername>\.dbt\profiles.yml
# If directory .dbt and/or file profiles.yml do not exist then create them so that the path
# above is preserved.
# Replace uppercased values with proper ones.

biosignals_lakehouse:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: 'dev_lakehouse.duckdb'
      extensions:
        - httpfs
        - postgres
      attach:
        - path: "dbname=experiment_db user=USERNAME password=PASSWORD host=localhost port=5432"
          alias: postgres_meta
          type: postgres
          read_only: true
      secrets:
        - type: s3
          key_id: 'ENTER_MINIO_LOGIN'
          secret: 'ENTER_MINIO_PASSWORD'
          endpoint: 'VM_ADDRESS:9000'
          url_style: 'path'
          use_ssl: false